name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The code generator needs the Triple-based LLVM 21 APIs, and Ubuntu 24.04
  # only ships 18, so the toolchain comes from apt.llvm.org.
  LLVM_VERSION: "21"

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euxo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "llvm-$LLVM_VERSION-dev" "lld-$LLVM_VERSION" \
            ninja-build zlib1g-dev libzstd-dev libxml2-dev \
            qemu-user \
            gcc-aarch64-linux-gnu   libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-riscv64-linux-gnu   libc6-dev-riscv64-cross
          # cmc looks for `ld.lld`, which is also the name the C driver goes
          # looking for once it is told -fuse-ld=lld. Only the versioned name
          # is reliably packaged, so make the plain one exist.
          sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/ld.lld" /usr/local/bin/ld.lld

      - name: Select the compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CMAKE_C_COMPILER=gcc"    >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER=g++"  >> "$GITHUB_ENV"
          else
            echo "CMAKE_C_COMPILER=clang-$LLVM_VERSION"    >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER="$CMAKE_C_COMPILER" \
            -DCMAKE_CXX_COMPILER="$CMAKE_CXX_COMPILER" \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm" \
            -DCMINUS_WERROR=ON

      - name: Build
        run: cmake --build build

      # Falling back to the system linker would leave the lld path untested
      # while the job still passed, so check the binary and not just the flag:
      # lld records itself in .comment, the system linker does not.
      - name: Check that lld really performs the link
        run: |
          set -euxo pipefail
          ./build/cmc -v examples/gcd.cm -o /tmp/gcd 2>&1 | tee /tmp/link.txt
          grep -q -- "-fuse-ld=lld" /tmp/link.txt
          readelf -p .comment /tmp/gcd | grep -qi "LLD"

      # CC is the linker driver the end-to-end tests use to turn cmc's object
      # files into programs; it is independent of what built cmc itself.
      - name: Test
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          # The cross suite skips itself where no cross toolchain exists, and
          # a skip here would be indistinguishable from a pass.
          CROSS_REQUIRED: "1"
        run: ctest --test-dir build --output-on-failure

  # Parses meta-cminus against openembedded-core rather than building it: a
  # real build compiles LLVM from source and takes hours. Parsing still
  # catches the layer going stale -- a renamed CMake option, a recipe that
  # stops resolving, a LAYERSERIES_COMPAT that no longer exists.
  yocto-layer:
    name: Yocto layer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: cminus

      - name: Install BitBake's host requirements
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk diffstat chrpath cpio zstd lz4 file locales \
            rpcsvc-proto
          # rpcsvc-proto is there for rpcgen, which BitBake lists in HOSTTOOLS
          # and no base Ubuntu carries. A missing entry in that list aborts the
          # first bitbake command a second in, before this layer is read at all.
          # BitBake refuses to start without this one.
          sudo sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen

      - name: Fetch BitBake and openembedded-core
        run: |
          set -euxo pipefail
          mkdir -p oe && cd oe
          git clone --depth 1 https://git.openembedded.org/bitbake
          git clone --depth 1 https://git.openembedded.org/openembedded-core

      # The checks live in a script so that a failure here can be reproduced
      # locally by running the same thing. Workflow logs need a sign-in to
      # read, so every error is repeated as an annotation, which the checks
      # API serves to anyone.
      - name: Parse the layer and check what it resolves to
        run: |
          set -o pipefail
          rc=0
          bash cminus/.github/scripts/yocto-layer-check.sh \
            "$GITHUB_WORKSPACE/cminus/meta-cminus" "$GITHUB_WORKSPACE/oe" \
            2>&1 | tee parse.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            # BitBake puts the interesting part -- which tool, which recipe --
            # on the lines after the one saying ERROR, so carry them along.
            grep -E -A2 '^(ERROR|Error|.*: error:)' parse.log |
              grep -v '^--$' | head -9 |
              while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::yocto-layer-check.sh exited $rc"
            exit "$rc"
          fi

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euxo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "llvm-$LLVM_VERSION-dev" "lld-$LLVM_VERSION" \
            ninja-build zlib1g-dev libzstd-dev libxml2-dev \
            qemu-user \
            gcc-aarch64-linux-gnu   libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-riscv64-linux-gnu   libc6-dev-riscv64-cross
          # cmc looks for `ld.lld`, which is also the name the C driver goes
          # looking for once it is told -fuse-ld=lld. Only the versioned name
          # is reliably packaged, so make the plain one exist.
          sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/ld.lld" /usr/local/bin/ld.lld

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="clang-$LLVM_VERSION" \
            -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION" \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm" \
            -DCMINUS_SANITIZERS=ON \
            -DCMINUS_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          # The cross suite skips itself where no cross toolchain exists, and
          # a skip here would be indistinguishable from a pass.
          CROSS_REQUIRED: "1"
        run: ctest --test-dir build --output-on-failure
