# Layer configuration for meta-cminus.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cminus"
BBFILE_PATTERN_cminus = "^${LAYERDIR}/"
BBFILE_PRIORITY_cminus = "6"

LAYERDEPENDS_cminus = "core"

# Only what has actually been built. wrynose looks compatible -- its
# bitbake.conf sets S the same way, and it carries LLVM 22 -- but "looks
# compatible" is not the same claim, so it is left out until someone builds
# there and adds it. walnascar and older cannot work at all: they carry LLVM
# 20.1, below the version floor cmc's CMakeLists enforces.
LAYERSERIES_COMPAT_cminus = "blacksail"
