# Layer configuration for meta-cminus.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cminus"
BBFILE_PATTERN_cminus = "^${LAYERDIR}/"
BBFILE_PRIORITY_cminus = "6"

LAYERDEPENDS_cminus = "core"

# The names openembedded-core itself declares in LAYERSERIES_CORENAMES.
#
# cmc needs LLVM 21 or newer, and oe-core carried 20.1 as recently as
# walnascar, so the older series are excluded on purpose rather than by
# omission: the recipe would configure and then fail the version floor.
LAYERSERIES_COMPAT_cminus = "wrynose blacksail"
